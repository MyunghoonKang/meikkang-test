<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP 로그인 (Mock)</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
    .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.15); width: 340px; }
    h2 { text-align: center; margin-bottom: 24px; color: #333; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    input:disabled { background: #f5f5f5; color: #999; }
    button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #1558b0; }
    #passwordSection { display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>ERP 시스템 로그인</h2>

    <div class="field">
      <label for="companyCode">회사 코드</label>
      <input id="companyCode" type="text" disabled value="meissa" />
    </div>

    <div class="field">
      <label for="userId">사용자 ID</label>
      <input id="userId" type="text" placeholder="사용자 ID를 입력하세요" autocomplete="username" />
    </div>

    <button id="nextBtn" type="button">다음</button>

    <div id="passwordSection">
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" />
      </div>
      <button id="loginBtn" type="button">로그인</button>
    </div>
  </div>

  <script>
    document.getElementById('nextBtn').addEventListener('click', function () {
      var userId = document.getElementById('userId').value.trim();
      if (!userId) {
        alert('사용자 ID를 입력하세요.');
        return;
      }
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('passwordSection').style.display = 'block';
      document.getElementById('password').focus();
    });

    document.getElementById('loginBtn').addEventListener('click', function () {
      var password = document.getElementById('password').value;
      if (!password) {
        alert('비밀번호를 입력하세요.');
        return;
      }
      // Navigate to write-form after successful login
      window.location.href = 'erp-writeform.html';
    });

    // Allow pressing Enter in userId field to trigger Next
    document.getElementById('userId').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('nextBtn').click();
    });

    // Allow pressing Enter in password field to trigger Login
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
